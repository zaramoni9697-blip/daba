plugins { id 'com.android.application' }

android {
    namespace 'com.jarvis.ai'
    compileSdk 36
    signingConfigs {\n        debug {\n            storeFile file(System.getenv("JARVIS_KEYSTORE") ?: "${rootDir}/debug.keystore")\n            storePassword System.getenv("JARVIS_STORE_PASSWORD") ?: "android"\n            keyAlias System.getenv("JARVIS_KEY_ALIAS") ?: "androiddebugkey"\n            keyPassword System.getenv("JARVIS_KEY_PASSWORD") ?: "android"\n        }\n    }\n\n    buildTypes {\n        debug {\n            signingConfig signingConfigs.debug\n        }\n    }\n\n    defaultConfig {
        applicationId 'com.jarvis.ai'
        minSdk 26
        targetSdk 35
        versionCode 11
        versionName "1.1.0"
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core:1.17.0'
    implementation 'androidx.activity:activity:1.10.1'
}
