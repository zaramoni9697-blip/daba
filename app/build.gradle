plugins { id 'com.android.application' }

android {
    namespace 'com.jarvis.ai'
    compileSdk 36

    signingConfigs {
        debug {
            storeFile file(System.getenv("JARVIS_KEYSTORE") ?: "${rootDir}/debug.keystore")
            storePassword System.getenv("JARVIS_STORE_PASSWORD") ?: "android"
            keyAlias System.getenv("JARVIS_KEY_ALIAS") ?: "androiddebugkey"
            keyPassword System.getenv("JARVIS_KEY_PASSWORD") ?: "android"

            // Maximum compatibility with Android 10 and older package installers.
            enableV1Signing true
            enableV2Signing true
            enableV3Signing false
            enableV4Signing false
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }

    defaultConfig {
        applicationId 'com.jarvis.ai.v124'
        minSdk 23
        targetSdk 33
        versionCode 31
        versionName "1.3.8"
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core:1.17.0'
    implementation 'androidx.activity:activity:1.10.1'
}
