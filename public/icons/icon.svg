<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="80%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <linearGradient id="shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#gold)" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Chessboard geometric subtle pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1.5">
    <line x1="64" y1="0" x2="64" y2="512" />
    <line x1="128" y1="0" x2="128" y2="512" />
    <line x1="192" y1="0" x2="192" y2="512" />
    <line x1="256" y1="0" x2="256" y2="512" />
    <line x1="320" y1="0" x2="320" y2="512" />
    <line x1="384" y1="0" x2="384" y2="512" />
    <line x1="448" y1="0" x2="448" y2="512" />
    <line x1="0" y1="64" x2="512" y2="64" />
    <line x1="0" y1="128" x2="512" y2="128" />
    <line x1="0" y1="192" x2="512" y2="192" />
    <line x1="0" y1="256" x2="512" y2="256" />
    <line x1="0" y1="320" x2="512" y2="320" />
    <line x1="0" y1="384" x2="512" y2="384" />
    <line x1="0" y1="448" x2="512" y2="448" />
  </g>

  <!-- Central Shield -->
  <path d="M 256 80 L 380 140 L 380 270 C 380 360 256 420 256 420 C 256 420 132 360 132 270 L 132 140 Z" 
        fill="url(#shield)" stroke="url(#gold)" stroke-width="6" filter="url(#shadow)" />

  <!-- Crown and Knight Silhouette -->
  <!-- Crown on Top -->
  <path d="M 196 170 L 216 220 L 256 160 L 296 220 L 316 170 L 316 240 L 196 240 Z" 
        fill="url(#gold)" />
  <circle cx="196" cy="165" r="7" fill="#fef08a" />
  <circle cx="256" cy="155" r="9" fill="#fef08a" />
  <circle cx="316" cy="165" r="7" fill="#fef08a" />

  <!-- Knight Head Silhouette -->
  <path d="M 210 350 C 210 320 220 295 240 280 C 240 270 230 260 226 248 C 220 230 234 218 248 226 C 260 216 278 222 284 236 C 294 258 288 286 278 304 C 290 310 302 324 302 350 Z" 
        fill="url(#gold)" />
  
  <!-- Base Pedestal -->
  <rect x="180" y="348" width="152" height="18" rx="6" fill="url(#gold)" />
  <rect x="195" y="370" width="122" height="12" rx="4" fill="url(#gold)" />
</svg>
