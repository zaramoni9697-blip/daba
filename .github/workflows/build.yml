name: Build JARVIS APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Create APK signing key
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/jarvis-debug.keystore" \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=JARVIS Debug,O=JARVIS,C=US"

      - name: Build maximum-compatibility APK
        env:
          JARVIS_KEYSTORE: ${{ runner.temp }}/jarvis-debug.keystore
          JARVIS_STORE_PASSWORD: android
          JARVIS_KEY_ALIAS: androiddebugkey
          JARVIS_KEY_PASSWORD: android
        run: gradle assembleRelease --no-daemon

      - name: Validate APK
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose --print-certs "$APK"
          $ANDROID_HOME/build-tools/36.0.0/aapt2 dump badging "$APK" | head -n 25
          unzip -t "$APK" >/dev/null
          $ANDROID_HOME/build-tools/36.0.0/zipalign -c -P 4 -v 4 "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-android11-compat-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
